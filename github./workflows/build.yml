name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Dylib
      run: |
        make

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Bypass-Dylib
        path: Bypass.dylib
